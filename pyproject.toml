[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-production-audit"
version = "1.0.0"
description = "Production-readiness, security, and migration auditor for Model Context Protocol captures and tool catalogs."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "MCPProductionAudit contributors"}]
keywords = ["mcp", "model-context-protocol", "ai-agents", "security", "audit", "observability", "migration", "json-rpc"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance"
]

[project.scripts]
mcp-production-audit = "mcp_production_audit.cli:main"
mcp-audit = "mcp_production_audit.cli:main"

[project.urls]
Homepage = "https://github.com/bafnayeygian/MCPProductionAudit"
Issues = "https://github.com/bafnayeygian/MCPProductionAudit/issues"

[tool.setuptools.packages.find]
where = ["src"]
